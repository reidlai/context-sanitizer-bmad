[workspace]
resolver = "2"
members = [
    "crates/context-sanitizer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/reidlai/context-sanitizer"
authors = ["Reid Lai"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
